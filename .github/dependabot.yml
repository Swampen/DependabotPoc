version: 2
updates:
  - package-ecosystem: "nuget"
    registries:
      - nuget
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      EventHubs:
        patterns:
          - "Azure.Messaging.EventHubs*"
      DotNet:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
      Prometheus:
        patterns:
          - "prometheus-net*"
      Serilog:
        patterns:
          - "Serilog*"
      TestDependencies:
        patterns:
          - "Bogus"
          - "coverlet.collector"
          - "JunitXml.TestLogger"
          - "NSubstitute"
          - "Microsoft.NET.Test.Sdk"
          - "Respawn"
          - "Shouldly"
          - "Testcontainer*"
          - "xunit*"
    ignore:
      - dependency-name: "csharpier"
registries:
  nuget:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
